[project]
name = "marketing-court"
version = "0.1.0"
description = "Evidence-driven marketing review and consumer simulation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    "pillow>=11,<13",
    "pypdf>=6,<8",
    "python-docx>=1.1,<2",
    "tinytroupe",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "httpx2>=2,<3"]

[project.optional-dependencies]
ocr = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]

[tool.uv]
package = false

[tool.uv.sources]
tinytroupe = { path = "vendor/tinytroupe", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
