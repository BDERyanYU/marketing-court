[project]
name = "marketing-court"
version = "0.1.0"
description = "Advertising review hearing and consumer simulation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.8,<3",
    "pypdf>=6,<8",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.22,<1",
    "tinytroupe",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8.4,<10"]

[tool.uv]
package = false

[tool.uv.sources]
tinytroupe = { path = "vendor/tinytroupe", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
